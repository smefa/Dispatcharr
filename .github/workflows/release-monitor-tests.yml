name: Release Monitor Tests

on:
  push:
    branches: [main, ci/upstream-release-rebuild]
    paths:
      - scripts/prepare_upstream_release.sh
      - scripts/update_fork_readme.py
      - docs/xc-output-profiles.md
      - README.md
      - scripts/tests/test_*.py
      - scripts/release_repair.py
      - .github/workflows/upstream-release-repair.yml
      - .github/workflows/upstream-release-rebuild.yml
      - .github/workflows/release-monitor-tests.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/prepare_upstream_release.sh
      - scripts/update_fork_readme.py
      - docs/xc-output-profiles.md
      - README.md
      - scripts/tests/test_*.py
      - scripts/release_repair.py
      - .github/workflows/upstream-release-repair.yml
      - .github/workflows/upstream-release-rebuild.yml
      - .github/workflows/release-monitor-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run release monitor integration tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check release preparation shell syntax
        run: bash -n scripts/prepare_upstream_release.sh
